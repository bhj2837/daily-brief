# GitHub Pages 자동 배포 (main 브랜치 푸시 시)
# 저장소 Settings → Pages → Source 를 "GitHub Actions"로 설정하면 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # 저장소 이름(daily-brief) 하위 경로로 배포되므로 base 지정
      - name: Build
        run: npm run build -- --base=/daily-brief/
        env:
          # (선택) 실데이터용 키 — 저장소 Settings → Secrets에 등록 시 자동 반영, 없으면 샘플
          VITE_FINNHUB_API_KEY: ${{ secrets.VITE_FINNHUB_API_KEY }}
          VITE_GNEWS_API_KEY: ${{ secrets.VITE_GNEWS_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}

      # SPA 딥링크/새로고침 404 방지 (GitHub Pages는 SPA 폴백이 없으므로 index를 404로 복제)
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
